name: Mobile Release

on:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app dependencies
        run: cd app && npm ci

      - name: Build mobile web assets
        run: cd app && npm run build:mobile

      - name: Capacitor sync android
        run: cd app && npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yaotu-release.keystore"

      - name: Build signed release APK
        env:
          YAOTU_KEYSTORE_PATH: ${{ runner.temp }}/yaotu-release.keystore
          YAOTU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YAOTU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YAOTU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd app/android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Rename APK with version tag
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          src="app/android/app/build/outputs/apk/release/app-release.apk"
          dest="yaotu-mobile-v${version}.apk"
          mv "$src" "$dest"
          echo "APK_PATH=$dest" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 妖荼手机版 v${{ env.APP_VERSION }}
          prerelease: false
          files: ${{ env.APK_PATH }}
