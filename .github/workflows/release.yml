name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Build web UI (/studio)
        run: npm run build:ui

      # Test 必须放在 build:ui 之后：test/rerollParams.test.mjs 顶部
      # import 了 app/node_modules/typescript/lib/typescript.js，而根目录
      # npm ci 不装 app/ 依赖，只有 build:ui（cd app && npm install）跑完
      # 之后这个文件才存在，否则 Test 会直接因文件缺失报错。
      - name: Test
        run: npm test

      - name: Ensure GitHub release exists (prevents electron-builder duplicate-release race)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists - reusing it."
          else
            echo "Pre-creating release $tag"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "${tag#v}" --generate-notes --verify-tag
          fi

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, re-running the workflow >2h after the release was
          # created makes electron-builder silently skip all uploads
          # (gitHubPublisher.js "published more than 2 hours ago" check).
          EP_GH_IGNORE_TIME: "true"
        run: npx electron-builder --win nsis --x64 --publish always --config.directories.output=dist-installer
