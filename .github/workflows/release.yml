name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Test
        run: npm test

      - name: Build web UI (/studio)
        run: npm run build:ui

      - name: Ensure GitHub release exists (prevents electron-builder duplicate-release race)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists - reusing it."
          else
            echo "Pre-creating release $tag"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "${tag#v}" --generate-notes --verify-tag
          fi

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always --config.directories.output=dist-installer
